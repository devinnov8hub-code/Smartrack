# Render Blueprint for the backend. In Render: New > Blueprint > pick this repo.
# Values marked sync: false are prompted for in the dashboard, never committed.
services:
  - type: web
    name: smartrack-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev because tsc lives in devDependencies and NODE_ENV=production skips them
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: REDIS_URL
        sync: false
